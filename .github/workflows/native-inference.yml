name: Native inference without R
on: [push, pull_request]
jobs:
  native:
    runs-on: ubuntu-latest
    container: python:3.13-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Build and test without an R runtime
        shell: bash
        run: |
          if command -v R || command -v Rscript; then exit 1; fi
          g++ -std=c++17 -O2 -Wall -Wextra -ffp-contract=off -fno-fast-math -Isrc/include src/inference.cpp native/test.cpp -o /tmp/ntf-test
          /tmp/ntf-test
          g++ -std=c++17 -O2 -ffp-contract=off -fno-fast-math -Isrc/include src/inference.cpp native/cli.cpp -o /tmp/ntf-predict
          g++ -std=c++17 -O2 -ffp-contract=off -fno-fast-math -Isrc/include src/inference.cpp native/convert.cpp -o /tmp/ntf-convert
          python3 native/test_converter.py /tmp
          if ldd /tmp/ntf-predict | grep -E 'libR\.'; then exit 1; fi
